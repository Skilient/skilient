syntax = "proto3";

package skilient.credentials.v1;

// credentials: the Record (signed co-curricular entries, claims, share links, corrections, officers' confirm,
// correct, decline and revoke, transcripts and certificates) and verified CVs (CvSnapshotV1, settings, signed
// versions, re-issue and the monthly refresh, signing keys and the public key file, share links, views, verify,
// revoke, PDF exports) (docs/azure/prd.md, service catalogue; docs/azure/credentials-function-bins.md maps every
// ported SQL function to a method here).
//
// Refusals carry a short snake_case reason in the x-refusal metadata (services/credentials/src/refusals.ts lists
// each with today's wording for web); wording with a value in it carries the values in x-refusal-values. Times
// are RFC 3339 strings and dates YYYY-MM-DD; an empty string means none. Page documents are JSON (`json`),
// shaped as the current stack's functions returned them; names and university names in them are filled from
// people's batch reads in the same call. Signatures are Ed25519 over the SHA-256 of the RFC 8785 canonical JSON
// of the envelope, as before the move; codes share one namespace for CVs and Record entries.
service CredentialsService {
  // ---- CVs ----

  // MyCv is the student's CV page: settings, versions, share links, view counts, exports, rights, tier.
  rpc MyCv(MyCvRequest) returns (MyCvResponse);
  // CvExportRights: what the student may export now (the upgrade sheet reads it; exports enforce it).
  rpc CvExportRights(CvExportRightsRequest) returns (CvExportRightsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SaveCvSettings(SaveCvSettingsRequest) returns (SaveCvSettingsResponse);
  // IssueCv: ensure (the first CV), reissue (the revoked newest version's content under a new code) or refresh
  // (Student Pro, on demand). Returns the newest unrevoked code.
  rpc IssueCv(IssueCvRequest) returns (IssueCvResponse);
  rpc RevokeCv(RevokeCvRequest) returns (RevokeCvResponse);
  // CreateCvShareLink makes the token (shown once, never stored: the reply is not kept for retries).
  rpc CreateCvShareLink(CreateCvShareLinkRequest) returns (CreateCvShareLinkResponse);
  rpc RevokeCvShareLink(RevokeCvShareLinkRequest) returns (RevokeCvShareLinkResponse);
  // OpenSharedCv: anyone with the link; always the newest version; one view per viewer key a day.
  rpc OpenSharedCv(OpenSharedCvRequest) returns (OpenSharedCvResponse);
  // VerifyCv: anyone. A revoked version gives its code and dates only. One database trip.
  rpc VerifyCv(VerifyCvRequest) returns (VerifyCvResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RecordCvExport records a PDF web made, with the MAC over its fields (the export secret).
  rpc RecordCvExport(RecordCvExportRequest) returns (RecordCvExportResponse);
  // PublicKeys is the document at /.well-known/skilient-cv-keys.json, byte for byte. One database trip.
  rpc PublicKeys(PublicKeysRequest) returns (PublicKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RequestPdf queues the render job (docs/azure/prd.md, "Jobs") for a CV version, a certificate or a transcript.
  rpc RequestPdf(RequestPdfRequest) returns (RequestPdfResponse);
  // PdfStatus: the job's state, and once done the file and its hash. One database trip.
  rpc PdfStatus(PdfStatusRequest) returns (PdfStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc OpsCvRecords(OpsCvRecordsRequest) returns (OpsCvRecordsResponse);
  rpc OpsRevokeCv(OpsRevokeCvRequest) returns (OpsRevokeCvResponse);

  // ---- The Record ----

  rpc MyRecord(MyRecordRequest) returns (MyRecordResponse);
  rpc SetRecordDisplay(SetRecordDisplayRequest) returns (SetRecordDisplayResponse);
  rpc ReportRecordMistake(ReportRecordMistakeRequest) returns (ReportRecordMistakeResponse);
  rpc CreateRecordShareLink(CreateRecordShareLinkRequest) returns (CreateRecordShareLinkResponse);
  rpc RevokeRecordShareLink(RevokeRecordShareLinkRequest) returns (RevokeRecordShareLinkResponse);
  // OpenRecordShare: anyone with the link; sealed entries the student shows; one view per viewer key a day.
  rpc OpenRecordShare(OpenRecordShareRequest) returns (OpenRecordShareResponse);
  // RecordHighlights: pinned entries on a profile, for a signed-in reader with no block either way.
  rpc RecordHighlights(RecordHighlightsRequest) returns (RecordHighlightsResponse);
  // RecordWaiting counts held entries waiting for this account's verified address.
  rpc RecordWaiting(RecordWaitingRequest) returns (RecordWaitingResponse);
  rpc ClaimRecordEntries(ClaimRecordEntriesRequest) returns (ClaimRecordEntriesResponse);
  rpc SaveCvActivities(SaveCvActivitiesRequest) returns (SaveCvActivitiesResponse);
  // CvActivityOptions: the student's sealed entries and the ones chosen for the CV. One database trip.
  rpc CvActivityOptions(CvActivityOptionsRequest) returns (CvActivityOptionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // MyEntries: the reader's own entries by id or by source (a proof task, a swap): code, title, line. For the
  // score page and the task and swap pages. One database trip.
  rpc MyEntries(MyEntriesRequest) returns (MyEntriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RecordPdfExport(RecordPdfExportRequest) returns (RecordPdfExportResponse);
  // VerifyRecordEntry: anyone. A revoked entry gives its code, dates and the reason's category. One database trip.
  rpc VerifyRecordEntry(VerifyRecordEntryRequest) returns (VerifyRecordEntryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // VerifyRecordTranscript: anyone; every entry on a transcript with its status today. One database trip.
  rpc VerifyRecordTranscript(VerifyRecordTranscriptRequest) returns (VerifyRecordTranscriptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ---- Officers and staff ----

  rpc SocietyRecordPage(SocietyRecordPageRequest) returns (SocietyRecordPageResponse);
  rpc ConfirmRecordEntry(ConfirmRecordEntryRequest) returns (ConfirmRecordEntryResponse);
  rpc CorrectRecordEntry(CorrectRecordEntryRequest) returns (CorrectRecordEntryResponse);
  rpc DeclineRecordMistake(DeclineRecordMistakeRequest) returns (DeclineRecordMistakeResponse);
  // RevokeRecordEntry: officers of the issuing society, or staff (trust reviewers and moderators, two-factor;
  // audited before and after).
  rpc RevokeRecordEntry(RevokeRecordEntryRequest) returns (RevokeRecordEntryResponse);
  rpc OpsRecordEntry(OpsRecordEntryRequest) returns (OpsRecordEntryResponse);
}

// ---- CVs ----

message MyCvRequest {}
message MyCvResponse {
  string json = 1;
}

message CvExportRightsRequest {}
message CvExportRightsResponse {
  bool pdf_export = 1;
  bool templates = 2;
  bool refresh_on_demand = 3;
}

message SaveCvSettingsRequest {
  repeated string sections = 1;
  // unset: follow the leaderboard setting.
  optional bool show_percentile = 2;
  bool show_email = 3;
  // private | link | recruiters.
  string visibility = 4;
}
message SaveCvSettingsResponse {}

message IssueCvRequest {
  // ensure | reissue | refresh.
  string action = 1;
}
message IssueCvResponse {
  // issued | exists | unchanged.
  string status = 1;
  string code = 2;
}

message RevokeCvRequest {
  string record_id = 1;
}
message RevokeCvResponse {}

message CreateCvShareLinkRequest {
  string label = 1;
  // 7, 30 or 90; 0 for a link without an expiry.
  int32 days = 2;
}
message CreateCvShareLinkResponse {
  string link_id = 1;
  // 32 random bytes, base64url; shown once.
  string token = 2;
}

message RevokeCvShareLinkRequest {
  string link_id = 1;
}
message RevokeCvShareLinkResponse {}

message OpenSharedCvRequest {
  string token = 1;
  // A keyed hash of the viewer's connection for the day (web's), 64 hex; empty to count nothing.
  string viewer_key = 2;
}
message OpenSharedCvResponse {
  // ok | unavailable | invalid.
  string state = 1;
  string username = 2;
  string code = 3;
  string issued_at = 4;
  string expires_at = 5;
  string key_id = 6;
  string snapshot_json = 7;
  string snapshot_hash = 8;
  string signature = 9;
}

message VerifyCvRequest {
  string code = 1;
  string pdf_hash = 2;
}
message VerifyCvResponse {
  bool found = 1;
  string code = 2;
  string issued_at = 3;
  string expires_at = 4;
  string revoked_at = 5;
  string superseded_at = 6;
  string key_id = 7;
  string public_key = 8;
  string snapshot_json = 9;
  string snapshot_hash = 10;
  string signature = 11;
  bool pdf_checked = 12;
  // Set only when a hash was checked against an unrevoked version.
  optional bool pdf_matches = 13;
}

message RecordCvExportRequest {
  string export_id = 1;
  string record_id = 2;
  string template = 3;
  string paper = 4;
  string pdf_hash = 5;
  int32 bytes = 6;
  string mac = 7;
}
message RecordCvExportResponse {}

message PublicKeysRequest {}
message PublicKeysResponse {
  // The JSON document, exactly as served.
  string document = 1;
}

message RequestPdfRequest {
  // cv | certificate | transcript.
  string kind = 1;
  string record_id = 2;
  string entry_id = 3;
  string template = 4;
  string paper = 5;
}
message RequestPdfResponse {
  string job_id = 1;
}

message PdfStatusRequest {
  string job_id = 1;
}
message PdfStatusResponse {
  // queued | done | failed.
  string status = 1;
  string path = 2;
  string pdf_hash = 3;
}

message OpsCvRecordsRequest {
  string query = 1;
}
message OpsCvRecordsResponse {
  string json = 1;
}

message OpsRevokeCvRequest {
  string record_id = 1;
  bool all = 2;
  string reason = 3;
}
message OpsRevokeCvResponse {
  int32 revoked = 1;
}

// ---- The Record ----

message MyRecordRequest {}
message MyRecordResponse {
  string json = 1;
}

message SetRecordDisplayRequest {
  string entry_id = 1;
  bool pinned = 2;
  bool hidden = 3;
}
message SetRecordDisplayResponse {}

message ReportRecordMistakeRequest {
  string entry_id = 1;
  string note = 2;
}
message ReportRecordMistakeResponse {
  string correction_id = 1;
}

message CreateRecordShareLinkRequest {
  string label = 1;
  // 7, 30 or 90.
  int32 days = 2;
}
message CreateRecordShareLinkResponse {
  string link_id = 1;
  string token = 2;
}

message RevokeRecordShareLinkRequest {
  string link_id = 1;
}
message RevokeRecordShareLinkResponse {}

message OpenRecordShareRequest {
  string token = 1;
  string viewer_key = 2;
}
message OpenRecordShareResponse {
  string json = 1;
}

message RecordHighlightsRequest {
  string user_id = 1;
}
message RecordHighlightsResponse {
  string json = 1;
}

message RecordWaitingRequest {}
message RecordWaitingResponse {
  int32 count = 1;
}

message ClaimRecordEntriesRequest {}
message ClaimRecordEntriesResponse {
  int32 claimed = 1;
}

message SaveCvActivitiesRequest {
  repeated string entry_ids = 1;
}
message SaveCvActivitiesResponse {}

message CvActivityOptionsRequest {}
message CvActivityOptionsResponse {
  string json = 1;
}

message MyEntriesRequest {
  repeated string entry_ids = 1;
  repeated string source_ids = 2;
}
message MyEntriesResponse {
  message Entry {
    string id = 1;
    string kind = 2;
    string source_id = 3;
    string title = 4;
    string issuer_name = 5;
    string line = 6;
    string code = 7;
    string status = 8;
  }
  repeated Entry entries = 1;
}

message RecordPdfExportRequest {
  string export_id = 1;
  // certificate | transcript.
  string kind = 2;
  string entry_id = 3;
  repeated string codes = 4;
  string pdf_hash = 5;
  int32 bytes = 6;
  string mac = 7;
}
message RecordPdfExportResponse {}

message VerifyRecordEntryRequest {
  string code = 1;
}
message VerifyRecordEntryResponse {
  // Empty when no sealed, superseded or revoked entry has the code.
  string json = 1;
}

message VerifyRecordTranscriptRequest {
  string export_id = 1;
}
message VerifyRecordTranscriptResponse {
  string json = 1;
}

// ---- Officers and staff ----

message SocietyRecordPageRequest {
  string society_id = 1;
}
message SocietyRecordPageResponse {
  string json = 1;
}

message ConfirmRecordEntryRequest {
  string entry_id = 1;
}
message ConfirmRecordEntryResponse {}

message CorrectRecordEntryRequest {
  string entry_id = 1;
  string title = 2;
  string line = 3;
  // Unset for unchanged.
  optional int32 place = 4;
  // Unset for unchanged.
  optional double hours = 5;
  string note = 6;
}
message CorrectRecordEntryResponse {
  string entry_id = 1;
}

message DeclineRecordMistakeRequest {
  string correction_id = 1;
  string note = 2;
}
message DeclineRecordMistakeResponse {}

message RevokeRecordEntryRequest {
  string entry_id = 1;
  // issued_in_error | not_earned | misconduct | other.
  string category = 2;
  string reason = 3;
}
message RevokeRecordEntryResponse {}

message OpsRecordEntryRequest {
  string code = 1;
}
message OpsRecordEntryResponse {
  // Empty when no entry has the code.
  string json = 1;
}
