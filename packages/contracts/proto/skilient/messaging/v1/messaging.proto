syntax = "proto3";

package skilient.messaging.v1;

// messaging: chat threads (DMs and venture team chats), members, messages, reactions, pins, read receipts,
// chat search, and the chat half of sharing a post (docs/azure/prd.md, service catalogue;
// docs/azure/messaging-function-bins.md maps every ported SQL function to a method here). Live delivery is the
// `realtime` service's: messaging sends each new message to the topic thread:{id} with Postgres NOTIFY in the
// same transaction, and a badge update to user:{id}.
//
// Refusals carry a short snake_case reason in the x-refusal metadata (services/messaging/src/refusals.ts lists
// each with today's wording for web). Times are RFC 3339 strings; an empty string means none.
// Thread types: dm | group.
service MessagingService {
  // ---- Threads ----

  // GetOrCreateDm opens the DM with someone (friends, or people an accepted application or skill swap joins).
  rpc GetOrCreateDm(GetOrCreateDmRequest) returns (GetOrCreateDmResponse);
  // MyThreads is the viewer's chat list, newest first, with unread counts.
  rpc MyThreads(MyThreadsRequest) returns (MyThreadsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UnreadChatCount is the chat badge: unread messages in threads that are not muted.
  rpc UnreadChatCount(UnreadChatCountRequest) returns (UnreadChatCountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // VentureChat is a venture's team chat, if the viewer is in it.
  rpc VentureChat(VentureChatRequest) returns (VentureChatResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ThreadPeople is who is in a thread (names from people; blocked members shown as such).
  rpc ThreadPeople(ThreadPeopleRequest) returns (ThreadPeopleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // MuteThread mutes a thread for some hours (0 unmutes; a year or more is "until I unmute").
  rpc MuteThread(MuteThreadRequest) returns (MuteThreadResponse);
  // MarkThreadRead moves the viewer's read mark to now.
  rpc MarkThreadRead(MarkThreadReadRequest) returns (MarkThreadReadResponse);
  // DmReceipt is when the other person last read the DM, when both have read receipts on.
  rpc DmReceipt(DmReceiptRequest) returns (DmReceiptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ---- Messages ----

  // SendMessage sends text, an image, or both, optionally as a reply. Returns the new id.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // EditMessage changes the viewer's own message.
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  // DeleteMessage blanks the viewer's own message; returns its image path for the browser's cache.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  // ThreadMessages is a page of a thread, newest first.
  rpc ThreadMessages(ThreadMessagesRequest) returns (ThreadMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ToggleReaction adds, changes or removes the viewer's one reaction on a message. Returns whether it is on.
  rpc ToggleReaction(ToggleReactionRequest) returns (ToggleReactionResponse);
  // PinMessage pins or unpins a message in a venture's team chat (the venture's owner; at most 3).
  rpc PinMessage(PinMessageRequest) returns (PinMessageResponse);
  // ThreadPins is a thread's pinned messages.
  rpc ThreadPins(ThreadPinsRequest) returns (ThreadPinsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SearchChats searches the viewer's messages (at least 2 characters), optionally in one thread.
  rpc SearchChats(SearchChatsRequest) returns (SearchChatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ---- Sharing a post ----

  // ShareTargets is the DMs and venture chats a post can be shared into.
  rpc ShareTargets(ShareTargetsRequest) returns (ShareTargetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SharePost sends a post (with an optional note) into up to 5 chats. Returns the new message ids.
  rpc SharePost(SharePostRequest) returns (SharePostResponse);
  // UndoShare removes the shared messages within 15 seconds. Returns how many were removed.
  rpc UndoShare(UndoShareRequest) returns (UndoShareResponse);

  // ---- For other services ----

  // CanListen says whether a user may listen to a thread's live topic (realtime asks; cached 60 s there).
  rpc CanListen(CanListenRequest) returns (CanListenResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // OpenContactThread opens (or returns) the DM a recruiter's accepted contact request starts, labelled with
  // the organisation (market, W11).
  rpc OpenContactThread(OpenContactThreadRequest) returns (OpenContactThreadResponse);
  // CloseThread closes a contact DM: it stays readable, and no one can send (market, W11).
  rpc CloseThread(CloseThreadRequest) returns (CloseThreadResponse);

  // MessageExcerpts: what a chat notice says about messages (the first 120 characters, "Shared a post" or "Sent
  // an image") and the venture of a team chat (notify, W9). At most 200.
  rpc MessageExcerpts(MessageExcerptsRequest) returns (MessageExcerptsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetOrCreateDmRequest {
  string username = 1;
}

message GetOrCreateDmResponse {
  string thread_id = 1;
}

message MyThreadsRequest {}

message Thread {
  string id = 1;
  string type = 2;
  // A DM's other person's name (with the organisation for a contact DM), a venture chat's title, or
  // "Deleted account" / "Venture chat" when unknown.
  string title = 3;
  // Empty unless the viewer may see the other person's profile.
  string username = 4;
  string avatar_path = 5;
  string venture_id = 6;
  string last_message = 7;
  string last_message_at = 8;
  bool last_sender_is_me = 9;
  int32 unread = 10;
  bool muted = 11;
}

message MyThreadsResponse {
  repeated Thread threads = 1;
}

message UnreadChatCountRequest {}

message UnreadChatCountResponse {
  int32 count = 1;
}

message VentureChatRequest {
  string venture_id = 1;
}

message VentureChatResponse {
  // Empty when the viewer is not in the venture's chat.
  string thread_id = 1;
}

message ThreadPeopleRequest {
  string thread_id = 1;
}

message ThreadPeopleResponse {
  message Person {
    string user_id = 1;
    string name = 2;
    string username = 3;
    string avatar_path = 4;
    bool blocked = 5;
    bool is_me = 6;
  }
  repeated Person people = 1;
}

message MuteThreadRequest {
  string thread_id = 1;
  int32 hours = 2;
}

message MuteThreadResponse {}

message MarkThreadReadRequest {
  string thread_id = 1;
}

message MarkThreadReadResponse {}

message DmReceiptRequest {
  string thread_id = 1;
}

message DmReceiptResponse {
  string read_at = 1;
}

message Media {
  string path = 1;
  int32 width = 2;
  int32 height = 3;
}

message SendMessageRequest {
  string thread_id = 1;
  string body = 2;
  Media media = 3;
  string reply_to_id = 4;
}

message SendMessageResponse {
  string message_id = 1;
}

message EditMessageRequest {
  string message_id = 1;
  string body = 2;
}

message EditMessageResponse {}

message DeleteMessageRequest {
  string message_id = 1;
}

message DeleteMessageResponse {
  string media_path = 1;
}

message ThreadMessagesRequest {
  string thread_id = 1;
  string before = 2;
  int32 limit = 3;
}

message Reaction {
  string emoji = 1;
  int32 count = 2;
  bool mine = 3;
}

message Message {
  message Link {
    string url = 1;
    string title = 2;
    string description = 3;
    string site_name = 4;
  }
  string id = 1;
  string sender_id = 2;
  string body = 3;
  Media media = 4;
  string created_at = 5;
  string edited_at = 6;
  bool deleted = 7;
  string reply_to_id = 8;
  string reply_sender_id = 9;
  string reply_excerpt = 10;
  repeated Reaction reactions = 11;
  bool pinned = 12;
  Link link = 13;
  string shared_post_id = 14;
  bool shared = 15;
}

message ThreadMessagesResponse {
  repeated Message messages = 1;
}

message ToggleReactionRequest {
  string message_id = 1;
  string emoji = 2;
}

message ToggleReactionResponse {
  bool on = 1;
}

message PinMessageRequest {
  string message_id = 1;
  bool pin = 2;
}

message PinMessageResponse {}

message ThreadPinsRequest {
  string thread_id = 1;
}

message ThreadPinsResponse {
  message Pin {
    string message_id = 1;
    string sender_id = 2;
    string excerpt = 3;
    string pinned_at = 4;
  }
  repeated Pin pins = 1;
}

message SearchChatsRequest {
  string q = 1;
  string thread_id = 2;
}

message SearchChatsResponse {
  message Hit {
    string message_id = 1;
    string thread_id = 2;
    string thread_title = 3;
    string sender_name = 4;
    string excerpt = 5;
    string created_at = 6;
  }
  repeated Hit hits = 1;
}

message ShareTargetsRequest {
  string q = 1;
}

message ShareTargetsResponse {
  message Target {
    string id = 1;
    string type = 2;
    string title = 3;
    string username = 4;
    string avatar_path = 5;
    string last_at = 6;
  }
  repeated Target targets = 1;
}

message SharePostRequest {
  string post_id = 1;
  // At most 5.
  repeated string thread_ids = 2;
  string note = 3;
}

message SharePostResponse {
  repeated string message_ids = 1;
}

message UndoShareRequest {
  repeated string message_ids = 1;
}

message UndoShareResponse {
  int32 removed = 1;
}

message CanListenRequest {
  string user_id = 1;
  string thread_id = 2;
}

message CanListenResponse {
  bool allowed = 1;
}

message OpenContactThreadRequest {
  string student_id = 1;
  string recruiter_id = 2;
  string org_id = 3;
}

message OpenContactThreadResponse {
  string thread_id = 1;
}

message CloseThreadRequest {
  string thread_id = 1;
}

message CloseThreadResponse {}

message MessageExcerptsRequest {
  repeated string message_ids = 1;
}
message MessageExcerptsResponse {
  message Entry {
    string message_id = 1;
    string thread_id = 2;
    string excerpt = 3;
    // A team chat's venture; empty for a DM.
    string venture_id = 4;
  }
  repeated Entry messages = 1;
}
