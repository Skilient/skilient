}

message SaveSocietyEventRequest {
  string society_id = 1;
  // Empty for a new draft.
  string event_id = 2;
  string type = 3;
  string title = 4;
  string description = 5;
  string cover_path = 6;
  string location = 7;
  string link = 8;
  repeated EventSession sessions = 9;
  repeated TicketTypeInput ticket_types = 10;
  Eligibility eligibility = 11;
  // 0 for no teams.
  int32 team_min = 12;
  int32 team_max = 13;
  // automatic | manual.
  string approval_mode = 14;
  string registration_opens_at = 15;
  string registration_closes_at = 16;
  repeated EventQuestion questions = 17;
  repeated string record_kinds = 18;
  int32 completed_min = 19;
  bool volunteer_hours = 20;
  // none | until.
  string refund_policy = 21;
  int32 refund_days = 22;
  // Co-hosts by slug: verified societies, who accept.
  repeated string cohosts = 23;
}
message SaveSocietyEventResponse {
  string event_id = 1;
}

