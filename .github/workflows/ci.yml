name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be mid-way through `supabase db push`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (with the release as a comment);
# Dependabot keeps both up to date.

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Decides whether this push/PR touches anything that can affect the build, the
      # database or the E2E suite. A docs-only or decisions.md-only change skips
      # database-checks, e2e and performance entirely (2026-10-08: those three dominate
      # CI's wall-clock time, and ran in full on several docs-only pushes tonight for no
      # reason). checks, gitleaks and audit always run regardless: they're cheap and
      # security-relevant. No base commit (first push, force-push, manual dispatch) runs
      # everything, to fail safe.
      - name: Decide whether app, database or test code changed
        id: filter
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable base commit (first push, force-push or manual dispatch) - running everything."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(app|components|lib|supabase|tests|public|scripts)/|^(next\.config\.ts|package\.json|pnpm-lock\.yaml|playwright.*\.config\.ts|vitest.*\.config\.mts|tsconfig\.json|\.github/workflows/ci\.yml)$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database-checks:
    name: pgTAP, worker test, types
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Rebuild the database from migrations + seed
        run: pnpm exec supabase db reset
      - name: pgTAP
        run: pnpm exec supabase test db
      - name: GitHub worker against the database (fake GitHub)
        run: pnpm test:worker
      # The Edge Functions boot (imports resolve) and refuse strangers. They have no
      # GitHub App secrets here, so the link function reports it isn't configured. Their
      # database code is covered by test:worker above (the local edge runtime can't resolve
      # the database container's hostname).
      - name: Edge Functions boot
        run: |
          # The first request boots the worker (and fetches its npm imports), so allow a minute.
          for i in $(seq 1 30); do
            worker=$(curl -s -o /tmp/worker.txt -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/github-worker || true)
            [ "$worker" = 401 ] && break
            sleep 2
          done
          link=$(curl -s --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/github-link -H 'content-type: application/json' -d '{}' || true)
          notify=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/notify-worker || true)
          preview=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/link-preview || true)
          cleanup=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/storage-cleanup || true)
          codecheck=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/code-check -H 'content-type: application/json' -d '{}' || true)
          cvsign=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/cv-sign -H 'content-type: application/json' -d '{}' || true)
          webhooks=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/webhook-worker || true)
          freeze=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/competition-freeze || true)
          billing=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/billing-worker || true)
          analytics=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST http://127.0.0.1:54321/functions/v1/analytics-worker || true)
          echo "github-worker: $worker $(cat /tmp/worker.txt)"
          echo "github-link: $link"
          echo "notify-worker: $notify"
          echo "link-preview: $preview"
          echo "storage-cleanup: $cleanup"
          echo "code-check: $codecheck"
          echo "cv-sign: $cvsign"
          echo "webhook-worker: $webhooks"
          echo "competition-freeze: $freeze"
          echo "billing-worker: $billing"
          echo "analytics-worker: $analytics"
          if [ "$worker" != 401 ] || [ "$notify" != 401 ] || [ "$preview" != 401 ] || [ "$cleanup" != 401 ] || [ "$codecheck" != 401 ] || [ "$cvsign" != 401 ] || [ "$webhooks" != 401 ] || [ "$freeze" != 401 ] || [ "$billing" != 401 ] || [ "$analytics" != 401 ] || ! echo "$link" | grep -q '"not_configured"'; then
            docker logs supabase_edge_runtime_skilient 2>&1 | tail -60
            exit 1
          fi
      - name: Supabase advisors (security + performance, fail on warn)
        run: pnpm exec supabase db advisors --local --type all --fail-on warn
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code types/database.ts || (echo "types/database.ts is stale: run pnpm db:types" && exit 1)

  e2e:
    name: E2E + axe (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Each shard starts its own local Supabase stack, so shards never share state and a slow
      # or flaky shard can't starve another's test timeouts (decisions.md 2026-10-08: the single
      # serial job's growing runtime was itself making late tests flaky).
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Mailpit stays on: the auth E2E tests read signup codes and reset links from it.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Rebuild the database from migrations + seed
        run: pnpm exec supabase db reset
      - name: Point the app at local Supabase
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          # Test fixtures only (Auth admin API on the throwaway local stack; its well-known dev key).
          echo "E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "E2E_MAILPIT_URL=http://127.0.0.1:54324" >> "$GITHUB_ENV"
          # The webhook route acts for no user; locally it uses the stack's dev secret key.
          echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          # Test-only GitHub App identity: links point at github.com, which the E2E test stubs.
          echo "GITHUB_APP_SLUG=skilient-e2e" >> "$GITHUB_ENV"
          echo "GITHUB_APP_CLIENT_ID=Iv1.e2e" >> "$GITHUB_ENV"
          echo "GITHUB_WEBHOOK_SECRET=e2e-webhook-signing-value" >> "$GITHUB_ENV"
          # CV PDF exports: the MAC key the migration generated into the local Vault, and the
          # address printed in verify links (decisions.md 2026-10-01).
          echo "CV_EXPORT_SECRET=$(docker exec supabase_db_skilient psql -U postgres -tAc "select decrypted_secret from vault.decrypted_secrets where name = 'cv_export_secret'")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100" >> "$GITHUB_ENV"
          # Billing (decisions.md 2026-10-05): the simulated gateway signs its webhooks with this test-only value.
          echo "SIMULATED_GATEWAY_SECRET=e2e-simulated-gateway-signing-value-0001" >> "$GITHUB_ENV"
      # Aggressive caching (decisions.md 2026-10-08): every shard was rebuilding from cold and
      # re-downloading Chromium from scratch. Both caches are shared across shards by key, so a
      # cache miss on shard 1 still leaves 2 and 3 a warm cache once shard 1's post-job save runs
      # on a later push; within one push the shards race, but a cold build/install is no worse
      # than before.
      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build (gallery enabled)
        run: pnpm build
        env:
          ENABLE_UI_GALLERY: "1"
      - name: Cache Playwright's browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Chromium for CV PDFs (the app server and the ATS test)
        run: echo "CV_CHROMIUM_PATH=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: ATS text test (every CV template printed and read back)
        # Independent of the browser shard split; only needs to run once.
        if: matrix.shard == 1
        run: pnpm test:ats
      - name: E2E (auth flows, gallery in both themes, axe-core, health)
        # No `--` before --shard: pnpm's own script body is already "playwright test", so a
        # literal `--` here becomes a second one once pnpm forwards it, which Playwright reads
        # as "end of flags" and treats --shard=N/M as a file-pattern argument instead of a flag
        # -- every shard silently ran the full suite (confirmed locally: `pnpm test:e2e --
        # --shard=1/3 --list` lists all tests; `pnpm test:e2e --shard=1/3 --list` lists 82).
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_EXPECT_HEALTHY: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  gitleaks:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner -v

  audit:
    name: Dependency audit (critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Audit reads the lockfile without installing packages, so no pnpm store exists to cache.
          package-manager-cache: false
      - run: pnpm audit --audit-level critical --prod

  performance:
    name: Lighthouse CI + size-limit (report only)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # PRD 10: performance budgets have leeway; they report on every PR but never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: size-limit
        run: pnpm size | tee size-limit.txt
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-reports
          path: |
            size-limit.txt
            .lighthouseci/
          # .lighthouseci/ is a dot-folder; upload-artifact skips hidden files unless told otherwise.
          include-hidden-files: true
          retention-days: 14

  migrate-production:
    name: Apply migrations and functions to Supabase (main only)
    # Runs only after every gate above is green on the merged commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, database-checks, e2e, gitleaks, audit]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false
    env:
      # Scoped personal access token (Supabase dashboard → Account → Access tokens).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check secrets are set
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; exit 1; fi
          done
      - name: Link project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        run: pnpm exec supabase db push --linked --dry-run
      - name: Apply migrations
        run: pnpm exec supabase db push --linked
      # GitHub App secrets are set on the project once by hand (decisions.md); this only ships code.
      - name: Deploy Edge Functions
        run: pnpm exec supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Supabase advisors on the live project (report)
        run: pnpm exec supabase db advisors --linked --type all --level warn
        continue-on-error: true
