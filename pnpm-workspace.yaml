packages:
  - apps/*
  - services/*
  - packages/*
  - jobs/*
  - tools/*

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - esbuild

# Security overrides for transitive dependencies (CI runs `pnpm audit --audit-level critical --prod`).
overrides:
  # GHSA-cg2g-xh64-v4q7: posthog-js allows ^3.4.13; 3.4.17 is the patched release.
  dompurify: ">=3.4.17"
