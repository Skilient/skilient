<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Skilient</title>
    <style>
      :root { color-scheme: light dark; --bg: #e6e1d8; --ink: #0e0d0b; --muted: #5c564d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #2a2723; --ink: #f2ede4; --muted: #c4bdb0; } }
      html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 32rem; margin: 0 auto; padding: 4rem 1rem; display: flex; flex-direction: column; gap: 1rem; }
      img { width: 48px; height: 48px; }
      h1 { font-size: 1.75rem; margin: 0; }
      p { margin: 0; color: var(--muted); }
      a { color: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/skilient-app-icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Skilient needs a connection for your feed and chats. Tickets you opened before still show without one.</p>
      <p><a href="/me/tickets">Try your tickets</a></p>
    </main>
  </body>
</html>
