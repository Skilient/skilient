syntax = "proto3";

package skilient.community.v1;

// community: societies (requests, members, officers and terms, invites, join requests, follows, induction
// rounds), society events (sessions, ticket types and the seat lock, the form, co-hosts, teams, staff,
// registrations and the waitlist, signed tickets, check-in per session, close-out, feedback, messages) and paid
// tickets (payment details confirmed by a second officer, receipts, holds, refunds, disputes) (docs/azure/prd.md,
// service catalogue; docs/azure/community-function-bins.md maps every ported SQL function to a method here).
//
// Refusals carry a short snake_case reason in the x-refusal metadata (services/community/src/refusals.ts lists
// each with today's wording for web); wording with a value in it carries the values in x-refusal-values. Times
// are RFC 3339 strings and dates YYYY-MM-DD; an empty string means none. Page documents are JSON (`*_json`),
// shaped as the current stack's functions returned them; names, usernames, avatars and university names in them
// are filled from people's batch reads in the same call. Tiers on member and attendee lists come from ranking's
// TiersOf (`tiers`: user id → tier). University events and fairs are market's (W11).
service CommunityService {
  // ---- Societies ----

  // SocietyNameCheck: is a society with this name (by its name key) already listed at the reader's university?
  rpc SocietyNameCheck(SocietyNameCheckRequest) returns (SocietyNameCheckResponse);
  // RequestSociety lists a new society as pending, with its proof (a document in media or an official link).
  rpc RequestSociety(RequestSocietyRequest) returns (RequestSocietyResponse);
  // ResubmitSociety: after "more info", the requester edits and sends it back for review.
  rpc ResubmitSociety(ResubmitSocietyRequest) returns (ResubmitSocietyResponse);
  rpc MySocietyRequests(MySocietyRequestsRequest) returns (MySocietyRequestsResponse);
  rpc SetSocietyImages(SetSocietyImagesRequest) returns (SetSocietyImagesResponse);
  rpc UpdateSociety(UpdateSocietyRequest) returns (UpdateSocietyResponse);
  rpc SetMembershipMode(SetMembershipModeRequest) returns (SetMembershipModeResponse);
  // SocietiesDirectory: verified societies (the reader's university first), and the reader's requests.
  rpc SocietiesDirectory(SocietiesDirectoryRequest) returns (SocietiesDirectoryResponse);
  rpc SocietyPage(SocietyPageRequest) returns (SocietyPageResponse);
  // SocietyManage is the officers' view: members, join requests, invites, terms.
  rpc SocietyManage(SocietyManageRequest) returns (SocietyManageResponse);
  rpc FollowSociety(FollowSocietyRequest) returns (FollowSocietyResponse);
  rpc JoinSociety(JoinSocietyRequest) returns (JoinSocietyResponse);
  rpc DecideJoinRequest(DecideJoinRequestRequest) returns (DecideJoinRequestResponse);
  rpc LeaveSociety(LeaveSocietyRequest) returns (LeaveSocietyResponse);
  rpc InviteOfficer(InviteOfficerRequest) returns (InviteOfficerResponse);
  rpc OfferHandover(OfferHandoverRequest) returns (OfferHandoverResponse);
  rpc AnswerSocietyInvite(AnswerSocietyInviteRequest) returns (AnswerSocietyInviteResponse);
  rpc MySocietyInvites(MySocietyInvitesRequest) returns (MySocietyInvitesResponse);
  rpc RemoveOfficer(RemoveOfficerRequest) returns (RemoveOfficerResponse);
  // ConfirmTerm: once a term has ended, the president confirms an officer's (another officer the president's).
  rpc ConfirmTerm(ConfirmTermRequest) returns (ConfirmTermResponse);
  rpc MyOfficerSocieties(MyOfficerSocietiesRequest) returns (MyOfficerSocietiesResponse);

  // ---- Induction rounds ----

  rpc SaveInductionRound(SaveInductionRoundRequest) returns (SaveInductionRoundResponse);
  rpc PublishInductionRound(PublishInductionRoundRequest) returns (PublishInductionRoundResponse);
  rpc InductionRoundPage(InductionRoundPageRequest) returns (InductionRoundPageResponse);
  rpc ApplyInduction(ApplyInductionRequest) returns (ApplyInductionResponse);
  // DecideInductionApplication: shortlist | accept | decline. Seats are counted under the role's row lock.
  rpc DecideInductionApplication(DecideInductionApplicationRequest) returns (DecideInductionApplicationResponse);

  // ---- Staff: society review (trust reviewers, two-factor; every write audited before and after) ----

  rpc OpsSocieties(OpsSocietiesRequest) returns (OpsSocietiesResponse);
  rpc OpsSocietyCase(OpsSocietyCaseRequest) returns (OpsSocietyCaseResponse);
  rpc ClaimSociety(ClaimSocietyRequest) returns (ClaimSocietyResponse);
  // DecideSociety: approve | more_info | reject | suspend | reinstate | pause_paid | resume_paid.
  rpc DecideSociety(DecideSocietyRequest) returns (DecideSocietyResponse);

  // ---- Events ----

  // SaveSocietyEvent creates a draft or edits one (officers of the host society).
  rpc SaveSocietyEvent(SaveSocietyEventRequest) returns (SaveSocietyEventResponse);
  // PublishEvent publishes a draft and makes its event post (content's CreatePost, as the officer).
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
  rpc CancelSocietyEvent(CancelSocietyEventRequest) returns (CancelSocietyEventResponse);
  rpc EventEditPayload(EventEditPayloadRequest) returns (EventEditPayloadResponse);
  rpc AnswerCohost(AnswerCohostRequest) returns (AnswerCohostResponse);
  // SocietyEvents: upcoming | past | mine, the reader's university first.
  rpc SocietyEvents(SocietyEventsRequest) returns (SocietyEventsResponse);
  rpc EventPage(EventPageRequest) returns (EventPageResponse);
  rpc SocietyEventList(SocietyEventListRequest) returns (SocietyEventListResponse);

  // ---- Registrations and tickets ----

  // RegisterEvent takes a seat under the ticket type's row lock (confirmed, held for a paid ticket, pending for
  // manual approval, or the waitlist), so parallel registrations never oversell.
  rpc RegisterEvent(RegisterEventRequest) returns (RegisterEventResponse);
  // CancelRegistration frees the seat and promotes the waitlist in order, under the same lock.
  rpc CancelRegistration(CancelRegistrationRequest) returns (CancelRegistrationResponse);
  rpc DecideRegistration(DecideRegistrationRequest) returns (DecideRegistrationResponse);
  rpc MyTickets(MyTicketsRequest) returns (MyTicketsResponse);
  // EventTicket is the reader's ticket, with its signed payload once confirmed (never stored in replies).
  rpc EventTicket(EventTicketRequest) returns (EventTicketResponse);

  // ---- Manage, check-in, close-out ----

  rpc EventManage(EventManageRequest) returns (EventManageResponse);
  rpc AddEventStaff(AddEventStaffRequest) returns (AddEventStaffResponse);
  rpc RemoveEventStaff(RemoveEventStaffRequest) returns (RemoveEventStaffResponse);
  rpc MessageRegistrants(MessageRegistrantsRequest) returns (MessageRegistrantsResponse);
  rpc SubmitEventFeedback(SubmitEventFeedbackRequest) returns (SubmitEventFeedbackResponse);
  // CheckInScan checks a signed ticket in once; a second scan answers with the first time (amber).
  rpc CheckInScan(CheckInScanRequest) returns (CheckInScanResponse);
  rpc CheckInSearch(CheckInSearchRequest) returns (CheckInSearchResponse);
  // CheckInPerson checks in a registered person, or registers an eligible walk-in on a free seat.
  rpc CheckInPerson(CheckInPersonRequest) returns (CheckInPersonResponse);
  // CheckInEmail adds a walk-in by university email (an account is checked in; anyone else is kept for the claim).
  rpc CheckInEmail(CheckInEmailRequest) returns (CheckInEmailResponse);
  rpc EventHeadcount(EventHeadcountRequest) returns (EventHeadcountResponse);
  // SocietyEventCode is the rotating self check-in code (30-second windows).
  rpc SocietyEventCode(SocietyEventCodeRequest) returns (SocietyEventCodeResponse);
  rpc SelfCheckIn(SelfCheckInRequest) returns (SelfCheckInResponse);
  rpc CloseoutPage(CloseoutPageRequest) returns (CloseoutPageResponse);
  rpc FixAttendance(FixAttendanceRequest) returns (FixAttendanceResponse);
  rpc SetEventResult(SetEventResultRequest) returns (SetEventResultResponse);
  rpc LogVolunteerHours(LogVolunteerHoursRequest) returns (LogVolunteerHoursResponse);
  // IssueEventEntries stores the close-out and hands it to credentials (event.closed) in one transaction.
  rpc IssueEventEntries(IssueEventEntriesRequest) returns (IssueEventEntriesResponse);
  rpc EventAttendeesRows(EventAttendeesRowsRequest) returns (EventAttendeesRowsResponse);

  // ---- Paid tickets ----

  rpc ProposePaymentMethod(ProposePaymentMethodRequest) returns (ProposePaymentMethodResponse);
  // ConfirmPaymentMethod: a second officer confirms (or rejects); the proposer can't.
  rpc ConfirmPaymentMethod(ConfirmPaymentMethodRequest) returns (ConfirmPaymentMethodResponse);
  rpc PaymentDetailsPage(PaymentDetailsPageRequest) returns (PaymentDetailsPageResponse);
  rpc TicketPayment(TicketPaymentRequest) returns (TicketPaymentResponse);
  rpc SubmitReceipt(SubmitReceiptRequest) returns (SubmitReceiptResponse);
  rpc PaymentsReview(PaymentsReviewRequest) returns (PaymentsReviewResponse);
  rpc ReviewPayment(ReviewPaymentRequest) returns (ReviewPaymentResponse);
  rpc RaisePaymentIssue(RaisePaymentIssueRequest) returns (RaisePaymentIssueResponse);
  rpc MarkRefundSent(MarkRefundSentRequest) returns (MarkRefundSentResponse);
  rpc ConfirmRefund(ConfirmRefundRequest) returns (ConfirmRefundResponse);

  // ---- For other services ----

  // SocietyCards is the society block on post cards (content) and the society labels on suggestions (people):
  // id, name, slug, logo. At most 200. One database trip.
  rpc SocietyCards(SocietyCardsRequest) returns (SocietyCardsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CanListenEvent: may this user listen to event:{id} (the live headcount)? Event officers and staff (realtime).
  rpc CanListenEvent(CanListenEventRequest) returns (CanListenEventResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RecordFacts is what the Record's entries need that event.closed and society.term_changed don't carry
  // (credentials): event titles, term titles, result labels, walk-ins' addresses (for the account check and the
  // claim) and society names and slugs. At most 200 of each.
  rpc RecordFacts(RecordFactsRequest) returns (RecordFactsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message SocietyNameCheckRequest {
  string name = 1;
}
message SocietyNameCheckResponse {
  string json = 1;
}

