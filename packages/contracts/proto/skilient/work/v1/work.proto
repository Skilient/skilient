  string skill_id = 1;
}

message SkillEvidenceResponse {
  message Item {
    int64 repo_id = 1;
    string repo_full_name = 2;
    string sha = 3;
    repeated string detectors = 4;
    repeated string paths = 5;
    int32 lines = 6;
    string occurred_at = 7;
    // counted | held | excluded | pending
    string status = 8;
    string exclusion = 9;
    bool signed = 10;
    string ai_agent = 11;
  }
  message Proof {
    // pull_request | contribution | endorsement | ai_pull_request | code_check | proof_task
    string kind = 1;
    int32 level = 2;
    string title = 3;
    string detail = 4;
    string url = 5;
    string venture_id = 6;
    // For an endorsement: who (names from people).
    string endorser_id = 7;
    string occurred_at = 8;
  }
  repeated Item items = 1;
  int32 total = 2;
  repeated Proof proofs = 3;
}

